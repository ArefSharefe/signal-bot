name: Signal Bot

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
    - cron: '2 * * * *'
    - cron: '2 */4 * * *'
    - cron: '2 0 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: signal-bot-${{ github.workflow }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ راه‌حل نهایی: استفاده از gh برای دانلود بدون خطا
      - name: Download previous database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download -n signals-db --dir . || true

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [[ "${{ github.event.schedule }}" == "2,17,32,47 * * * *" ]]; then
            python -c "import signals; signals.main_15m()"
          elif [[ "${{ github.event.schedule }}" == "2 * * * *" ]]; then
            python -c "import signals; signals.main_1h()"
          elif [[ "${{ github.event.schedule }}" == "2 */4 * * *" ]]; then
            python -c "import signals; signals.main_4h()"
          elif [[ "${{ github.event.schedule }}" == "2 0 * * *" ]]; then
            python -c "import signals; signals.main_1d()"
          else
            echo "Manual run: testing 4h scan"
            python -c "import signals; signals.main_4h()"
          fi

      - name: Upload database
        if: always() && hashFiles('signals.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: signals-db
          path: signals.db
          retention-days: 90
